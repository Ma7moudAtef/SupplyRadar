[project]
name = "supplyradar"
version = "0.1.0"
description = "SupplyRadar - supply-chain visibility for industrial manufacturers"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "plotly>=5.18",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "streamlit>=1.30",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "kaleido"]

[tool.setuptools.packages.find]
include = ["supplyradar*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# app entry files must extend sys.path before importing the package
"supplyradar/app/**" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
