# Stage palette for the pipeline chart.
# 'warehouse' and 'gap' are fixed semantic anchors: warehouse is GREEN, gap is
# RESERVED red — no configuration can override gap.
# Delivery labels found in the data take shades of BLUE from delivery_cycle,
# a light -> dark ramp. Stages are spread evenly across the ramp in ETA order
# (nearest arrival = lightest, furthest = darkest), so supply stages never
# resemble the warehouse green or the gap/threshold colors.
stages:
  warehouse: "#27ae60"
  gap: "#e74c3c"
delivery_cycle:
  - "#aed6f1"
  - "#85c1e9"
  - "#5dade2"
  - "#3498db"
  - "#2e86c1"
  - "#2874a6"
  - "#21618c"
  - "#1b4f72"
